name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tabular:
    name: tabular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tabular tests
        run: uv run pytest -m "not llm and not image and not deep"

  llm:
    name: llm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra llm
      - name: Run LLM unit tests
        run: uv run pytest -m llm tests/unit/test_llm_client.py tests/unit/test_brief_generator.py

  image:
    name: image
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra image
      - name: Run image integration tests
        run: uv run pytest -m image

  deep:
    name: deep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev --extra deep
      - name: Run deep integration tests
        run: uv run pytest -m deep
