runs_dir: runs
knowledge_dir: knowledge

# Milestone 2 Plan 3 — Automatic Comparator thresholds for improve-time
# comparison.json verdicts (`research experiments compare` uses the same defaults).
experiments:
  comparator:
    noise_epsilon: 0.001
    max_runtime_increase_pct: 50
  reflection:
    max_new_hypotheses: 3
  ranking:
    default_expected_gain: 0.0
    cheap_tags:
      - hyperparameter
      - hyperparams
      - tune
      - tuning
      - loss
      - scheduler
      - features
      - feature-engineering
      - learning_rate
      - num_leaves
      - n_estimators
      - target_encoding
      - log_numeric
    weights:
      expected_gain: 2.0
      implementation_cost: 0.5
      gpu_cost: 0.5
      risk: 1.0
      novelty: 0.5

# Optional LLM layer (`labpilot.llm`). Soft-fails to templates / rule_engine
# when no cloud key and Ollama is unreachable. Override with LABPILOT_LLM_MODE
# (auto|local|cloud), LABPILOT_LLM_PROVIDER, LABPILOT_LLM_MODEL, OLLAMA_HOST.
llm:
  mode: auto          # auto | local | cloud — set LABPILOT_LLM_MODE=cloud for demos
  provider: gemini    # default cloud provider (matches LABPILOT_LLM_PROVIDER in .env)
  model: gemini-3.5-flash-lite
  temperature: 0.3
  ollama_base_url: http://127.0.0.1:11434
  fallback_model: qwen2.5-coder:14b
  request_timeout_seconds: 600   # local 14B codegen far exceeds a 120s budget
  cache:
    enabled: true
    path: .cache/llm.sqlite
  tasks:
    planning: {}      # inherits gemini
    coding: {}        # inherits gemini (override provider/model here for Ollama coding)
    summary: {}       # inherits gemini
    default: {}
  budget_path: .cache/llm_budget.sqlite
  # Role-based routing. `providers` is empty by default, which keeps the legacy
  # provider-priority behaviour; add entries to switch a workspace over.
  #
  # Order is preference order — there is deliberately no built-in "paid beats
  # local", so a good local model can be listed first and win.
  routing:
    plan: free                    # free | pro | enterprise
    allow_training_on_inputs: true
    providers: []
    # Example — uncomment and set the key to route codegen to a strong model:
    #   - name: groq
    #     kind: openai_compat
    #     base_url: https://api.groq.com/openai/v1
    #     api_key_env: GROQ_API_KEY
    #     tier: free
    #     strong: true
    #     caps: [structured_output]
    #     rpm: 30
    #     models: {default: llama-3.3-70b-versatile}
    #   - name: ollama
    #     kind: ollama
    #     base_url: http://127.0.0.1:11434
    #     tier: local
    #     caps: [structured_output]
    #     models: {default: qwen2.5-coder:14b}
    roles:
      # A model that cannot constrain output to JSON will answer a JSON-only
      # prompt in prose and return HTTP 200 — so structured_output is required,
      # not preferred.
      # No `requires: [structured_output]` here, deliberately. codegen's output
      # is a file edit, validated by `ast.parse` and then by the training run —
      # never by JSON parsing. Naming the cap explicitly would outrank the
      # `CAPS_EXEMPT_ROLES` carve-out (an explicit requires always does) and
      # exclude models that are excellent editors for a capability the work
      # never uses. Every other role keeps the mandate via `MANDATORY_CAPS`.
      codegen:   {requires_strong: true,  on_exhaustion: wait}
      reasoning: {requires_strong: true,  requires: [structured_output], on_exhaustion: wait}
      summarize: {requires_strong: false, requires: [structured_output], on_exhaustion: degrade}
      default:   {requires_strong: false, requires: [structured_output], on_exhaustion: degrade}
  # Local-only alternative for non-coding tasks:
  #   planning: { model: qwen2.5-coder:14b, provider: ollama, force_local: true }
  # OpenAI cloud:
  #   provider: openai
  #   model: gpt-4o-mini

training:
  cv_folds: 5
  random_seed: 42

profiler:
  max_rows_sample: 100_000
  categorical_cardinality_threshold: 50
  max_images_sample: 5_000

deep_baseline:
  max_epochs: 3
  max_train_samples: 5_000
  cpu_max_epochs: 2
  cpu_max_train_samples: 2_000
  cv_folds: 3

kaggle:
  download_unzip: true
  submit_message: "labpilot baseline submission"
  kernel_poll_timeout: 3600
  kernel_poll_interval: 15

