runs_dir: runs

# Used to generate brief.md/reflection.md — entirely optional. If no API key
# is configured for the chosen provider (or the optional package isn't
# installed), LabPilot falls back to template-only text instead of failing.
# `model` defaults per-provider when left unset here (gpt-4o-mini for
# openai, gemini-3.5-flash for gemini); override LABPILOT_LLM_PROVIDER in
# .env to switch providers without editing this file.
llm:
  provider: openai
  # model: gpt-4o-mini
  temperature: 0.3
  # To use Gemini instead:
  #   provider: gemini
  #   model: gemini-3.5-flash
  # ...and set GEMINI_API_KEY (instead of OPENAI_API_KEY) in .env.

training:
  cv_folds: 5
  random_seed: 42

profiler:
  max_rows_sample: 100_000
  categorical_cardinality_threshold: 50
  max_images_sample: 5_000

deep_baseline:
  max_epochs: 3
  max_train_samples: 5_000
  cpu_max_epochs: 2
  cpu_max_train_samples: 2_000
  cv_folds: 3

kaggle:
  download_unzip: true
  submit_message: "labpilot baseline submission"

pipeline:
  stages:
    - parse_competition
    - download_data
    - profile_dataset
    - generate_brief
    - select_baseline
    - generate_code
    - train_model
    - evaluate_cv
    - generate_submission
    - upload_submission
    - log_experiment
    - write_reflection
