[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labpilot"
version = "1.0.0"
description = "One-command Kaggle competition research engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "kaggle>=1.6",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "rich>=13.0",
    "markdown>=3.5",
    "arxiv>=4.0.0",
    "anyio>=4.0",
    "blinker>=1.8",
]

[project.optional-dependencies]
llm = ["openai>=1.0", "google-genai>=1.0"]
image = ["torch>=2.0", "torchvision>=0.18", "pillow>=10.0"]
deep = ["torch>=2.0", "torchvision>=0.18", "pillow>=10.0", "transformers>=4.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
research = "labpilot.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/labpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "llm: marks tests that require the llm extra",
    "image: marks tests that require the image extra (torch, pillow)",
    "deep: marks tests that require the deep extra (transformers)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
